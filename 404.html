<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Page not found</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#141414" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23141414'/%3E%3Ctext x='16' y='22.5' font-family='Arial,sans-serif' font-size='18' font-weight='700' text-anchor='middle' fill='%23ffffff'%3EE%3C/text%3E%3C/svg%3E"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #fafafa;
        color: #141414;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .code {
        font-size: clamp(5rem, 22vw, 9rem);
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0.5rem 0;
      }
      p {
        color: #666;
        max-width: 40ch;
        margin: 0 auto 1.75rem;
      }
      a {
        display: inline-block;
        background: #141414;
        color: #fff;
        text-decoration: none;
        padding: 0.8rem 1.5rem;
        border-radius: 999px;
        font-weight: 600;
      }
      a:hover,
      a:focus-visible {
        background: #333;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1>This page doesn't exist</h1>
      <p>The link may be broken or the page may have moved. Head back to the project gallery to explore the stores.</p>
      <a href="/ecommerce-portfolio/" id="home">Back to projects</a>
    </main>
    <script>
      // Works both on GitHub Pages (/ecommerce-portfolio/) and on a local server (/)
      if (!location.pathname.startsWith("/ecommerce-portfolio")) document.getElementById("home").href = "/";
    </script>
  </body>
</html>
